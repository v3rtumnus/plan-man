server.port=8086

spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=plan-man
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults = false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.mvc.static-path-pattern=/resources/**

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

caching.spring.fxTTL=86400000
caching.spring.snapshotTTL=3600000

financial.shares.quote.retrieval=0 0 * * * MON-FRI
financial.shares.quote.threshold.hours=23
financial.shares.snapshot.persistence=0 15 0 * * *

logging.level.org.apache.hc.client5.http.wire=INFO

management.endpoints.web.exposure.include=health,info,metrics,prometheus

# MCP Server
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=plan-man
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE

# Shared secret Traefik sends with Remote-User (empty = header login off)
planman.security.proxy-secret=${PLANMAN_PROXY_SECRET:}

# Health: meal recognition (Claude). No key = manual entry only.
planman.health.ai.api-key=${ANTHROPIC_API_KEY:}
# Sonnet since 2026-11-08: 26/28 vs Haiku 20/28 on a 14-meal eval (LiveMealEvalTest)
planman.health.ai.meal-model=claude-sonnet-5-5
# Model comparison: the first N recognitions also run this model (empty = off)
planman.health.ai.compare-model=
planman.health.ai.compare-count=10
# Weekly review + 4-weekly goal check (H4): Opus, daily at 05:30 so a failed Monday is retried
planman.health.ai.review-model=claude-opus-5-5
planman.health.review-cron=0 30 5 * * *
# a capture with a photo posts ~300 KB of base64
server.tomcat.max-http-form-post-size=4MB

# Notifications (N1): hourly rule evaluation, Web Push (no key pair = push off), digest for n8n
planman.notifications.evaluation-cron=0 5 * * * *
planman.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
planman.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
planman.push.subject=https://plan-man.altenburger.io
planman.digest.token=${PLANMAN_DIGEST_TOKEN:}
