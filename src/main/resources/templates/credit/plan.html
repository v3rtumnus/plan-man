<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/header :: header-css}"/>
</head>
<body>

<div th:replace="~{fragments/header :: header}"/>

<div th:replace="~{fragments/sidebar :: sidebar}"/>

<main id="main" class="main">

    <div class="pagetitle">
        <h1>Tilgungsplan</h1>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Restschuld im Zeitverlauf</h4>
                    <canvas id="credit-plan-chart"></canvas>
                    <script th:inline="javascript">
                        new Chart(document.getElementById("credit-plan-chart"), {
                            type: 'line',
                            data: {
                                labels: [(${planDates})],
                                datasets: [{
                                    label: "Restschuld",
                                    data: [[${planBalances}]],
                                    borderColor: '#4154f1',
                                    backgroundColor: 'rgba(65, 84, 241, 0.15)',
                                    fill: true,
                                    pointRadius: 0
                                }]
                            },
                            options: {
                                plugins: {
                                    legend: { display: false }
                                }
                            }
                        });
                    </script>
                </div>
            </div>
        </div>
    </div>

    <section class="section">
        <div class="table-responsive">
        <table class="table table-striped">
            <thead>
            <tr>
                <th scope="col">Datum</th>
                <th scope="col">Beschreibung</th>
                <th scope="col">Transaktionsbetrag</th>
                <th scope="col">Neuer Kontostand</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="creditPlanRow: ${currentCreditPlan}">
                <th th:text="${#temporals.format(creditPlanRow.date, 'dd.MM.yyyy')}"></th>
                <td th:text="${creditPlanRow.description}"></td>
                <td th:text="${#numbers.formatDecimal(creditPlanRow.balanceChange, 0, 'POINT', 2, 'COMMA')}"></td>
                <td th:text="${#numbers.formatDecimal(creditPlanRow.newBalance, 0, 'POINT', 2, 'COMMA')}"></td>
            </tr>
            </tbody>
        </table>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer-js}"/>
</body>
</html>
