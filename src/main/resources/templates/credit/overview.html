<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/header :: header-css}"/>
</head>
<body>

<div th:replace="~{fragments/header :: header}"/>

<div th:replace="~{fragments/sidebar :: sidebar}"/>

<main id="main" class="main">

    <div class="pagetitle">
        <h1>Kredit&uuml;bersicht</h1>
    </div>

    <div class="alert alert-primary" role="alert" th:text="${successMessage}" th:if="${successMessage}"></div>
    <div class="alert alert-danger" role="alert" th:text="${errorMessage}" th:if="${errorMessage}"></div>

    <div class="dashboard">
        <div class="row">
            <div class="col-xl-4 col-md-6">
                <div class="card info-card sales-card">
                    <div class="card-body">
                        <h5 class="card-title">Restlaufzeit</h5>
                        <div class="d-flex align-items-center">
                            <div class="card-icon rounded-circle d-flex align-items-center justify-content-center">
                                <i class="bi bi-clock-history"></i>
                            </div>
                            <div class="ps-3">
                                <h6 th:inline="text">[[${yearsRemaining}]] J [[${monthsRemaining}]] M</h6>
                            </div>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between align-items-center small">
                            <span class="text-muted">Urspr&uuml;nglich</span>
                            <span th:inline="text">[[${originalYearsRemaining}]] J [[${originalMonthsRemaining}]] M</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xl-4 col-md-6">
                <div class="card info-card revenue-card">
                    <div class="card-body">
                        <h5 class="card-title">Sonderzahlungen bisher</h5>
                        <div class="d-flex align-items-center">
                            <div class="card-icon rounded-circle d-flex align-items-center justify-content-center">
                                <i class="bi bi-piggy-bank-fill"></i>
                            </div>
                            <div class="ps-3">
                                <h6 th:text="${#numbers.formatDecimal(additionalPaymentsSum, 0, 'POINT', 2, 'COMMA')} + ' €'"></h6>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xl-4 col-md-6">
                <div class="card info-card customers-card">
                    <div class="card-body">
                        <h5 class="card-title">Minimal m&ouml;gliche Rate</h5>
                        <div class="d-flex align-items-center">
                            <div class="card-icon rounded-circle d-flex align-items-center justify-content-center">
                                <i class="bi bi-currency-euro"></i>
                            </div>
                            <div class="ps-3">
                                <h6 th:text="${#numbers.formatDecimal(minimumInstallment, 0, 'POINT', 2, 'COMMA')} + ' €'"></h6>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card" style="height: 100%">
                <div class="card-body">
                    <h4 class="card-title">Neue Sondertilgung</h4>
                    <form class="row g-3" th:action="@{/credit}" th:object="${payment}" method="post">
                        <div class="col-md-3">
                            <input required name="amount" id="amount" type="number" placeholder="Betrag" class="form-control" th:field="*{amount}"/>
                        </div>
                        <div class="col-md-3">
                            <input required name="description" id="description" type="text" placeholder="Beschreibung" class="form-control" th:field="*{description}"/>
                        </div>
                        <div class="col-md-3">
                            <input required name="date" id="date" type="date" placeholder="Datum" class="form-control" th:field="*{date}"/>
                        </div>
                        <div class="col-md-3">
                            <div class="form-floating">
                                <button type="submit" class="btn btn-primary">Speichern</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <div class="card" style="height: 100%">
                <div class="card-body">
                    <h4 class="card-title">Sonderzahlungen bisher</h4>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="additionalPayment: ${additionalPayments}">
                            <span th:text="${#temporals.format(additionalPayment.date, 'dd.MM.yyyy')}"></span>
                            <span th:text="${#numbers.formatDecimal(additionalPayment.balanceChange, 0, 'POINT', 2, 'COMMA')} + ' €'"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer-js}"/>
</body>
</html>
